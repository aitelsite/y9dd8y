<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101218">
<title>Duck.ai — پرسش از هوش مصنوعی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101218;color:#f5f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
header{flex:0 0 auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#171a22;border-bottom:1px solid #303544}
h1{font-size:14px;margin:0}p{margin:4px 0 0;color:#aab0bf;font-size:11px;line-height:1.6}
a{color:#c4d1ff}.open{white-space:nowrap;border:1px solid #42495b;border-radius:10px;padding:8px 10px;color:#fff;text-decoration:none;font-size:12px}
main{flex:1;min-height:170px;position:relative}iframe{width:100%;height:100%;border:0;background:#101218}
.composer{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#171a22;border-top:1px solid #303544}
form{max-width:900px;margin:auto;display:flex;gap:8px;align-items:stretch}
textarea{flex:1;min-width:0;min-height:48px;max-height:120px;resize:vertical;background:#242936;color:#fff;border:1px solid #42495b;border-radius:13px;padding:12px;font:inherit;font-size:14px;outline:none}
textarea:focus{border-color:#879cff}
button{border:0;border-radius:12px;background:#e8edff;color:#141722;padding:0 18px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#status{max-width:900px;margin:6px auto 0;font-size:11px;color:#bdc4d5;line-height:1.6}
@media(max-width:540px){header{align-items:flex-start}.open{font-size:11px;padding:7px 8px}main{min-height:140px}form{gap:6px}button{padding:0 13px;font-size:13px}textarea{font-size:13px}}
</style>
</head>
<body>
<header>
<div><h1>Duck.ai — پرسش از هوش مصنوعی</h1><p>برای ارسال واقعی، پرسش به سایت رسمی Duck.ai منتقل می‌شود.</p></div>
<a class="open" href="https://duck.ai/" target="_blank" rel="noopener noreferrer">سایت اصلی ↗</a>
</header>
<main>
<iframe src="https://duckai-display-test-2026.oj155304.workers.dev/" title="نمایش Duck.ai" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
</main>
<section class="composer" aria-label="ارسال پرسش">
<form id="askForm">
<textarea id="question" placeholder="سؤالت را اینجا بنویس..." aria-label="متن پرسش" required></textarea>
<button type="submit">ارسال ↗</button>
</form>
<div id="status" role="status">متن را بنویس و «ارسال» را بزن؛ صفحه رسمی Duck.ai باز می‌شود و متن پرسش کپی می‌شود تا آنجا بچسبانی و ارسال کنی.</div>
</section>
<script>
const form=document.getElementById('askForm');
const input=document.getElementById('question');
const status=document.getElementById('status');
form.addEventListener('submit',async function(event){
 event.preventDefault();
 const question=input.value.trim();
 if(!question){status.textContent='لطفاً ابتدا سؤال را بنویس.';input.focus();return;}
 // Open directly from the user's click so mobile browsers do not block the tab.
 const tab=window.open('https://duck.ai/','_blank','noopener,noreferrer');
 try{
   await navigator.clipboard.writeText(question);
   status.textContent=tab?'سؤال کپی شد و Duck.ai در زبانهٔ جدید باز شد؛ در کادر گفتگو بچسبان و ارسال کن.':'متن سؤال کپی شد؛ سایت اصلی را با دکمهٔ بالا باز کن و متن را بچسبان.';
 }catch(error){
   status.textContent=tab?'Duck.ai باز شد؛ متن سؤال را انتخاب و کپی کن، سپس در کادر گفتگو بچسبان.':'برای ارسال، سایت اصلی Duck.ai را باز کن و سؤال را آنجا وارد کن.';
 }
});
</script>
</body>
</html>
