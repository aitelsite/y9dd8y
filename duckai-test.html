<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101218"><title>چت هوش مصنوعی</title>
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#191d27;--line:#343b4c;--text:#f5f6fa;--muted:#aeb6c7;--accent:#ffdf45}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:#151821;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--accent);color:#171717;font-size:23px}h1{font-size:16px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}button{font:inherit;cursor:pointer}.topbtn{background:#202633;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}main{width:min(100%,850px);margin:auto;flex:1;display:flex;flex-direction:column;padding:16px 13px 8px;min-height:0}.welcome{text-align:center;margin:auto;padding:25px 8px}.welcome .big{font-size:42px}.welcome h2{font-size:clamp(21px,5vw,28px);margin:10px 0}.welcome p{color:var(--muted);line-height:1.9;font-size:14px}#messages{display:flex;flex-direction:column;gap:14px;padding-bottom:16px}.msg{border-radius:16px;padding:12px 15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.msg.user{align-self:flex-start;max-width:92%;background:#2b3547;border:1px solid #3a465b;border-bottom-right-radius:5px}.msg.assistant{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.who{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.status{font-size:12px;color:var(--muted);padding:6px 3px;min-height:24px}.composer{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 18%);padding:12px 0 max(8px,env(safe-area-inset-bottom))}form{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid #454d60;border-radius:20px;padding:9px}textarea{resize:none;flex:1;min-width:0;max-height:180px;min-height:44px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.7;padding:9px 7px}textarea::placeholder{color:#8992a5}#send{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--accent);color:#171717;font-size:21px;font-weight:800;border:0}#send:disabled{opacity:.45}.foot{text-align:center;color:#7f8798;font-size:10px;line-height:1.7;padding:8px 4px 2px}@media(max-width:540px){header{padding:10px}.logo{width:35px;height:35px}h1{font-size:14px}.sub{font-size:10px}main{padding:10px}.msg{font-size:14px}}
</style></head><body>
<header><div class="brand"><div class="logo" aria-hidden="true">✳</div><div><h1>چت هوش مصنوعی</h1><div class="sub">گفتگو در همین سایت</div></div></div><button class="topbtn" id="newchat" type="button">گفتگوی جدید ↻</button></header>
<main><section class="welcome" id="welcome"><div class="big">✳</div><h2>چطور می‌تونم کمکت کنم؟</h2><p>سؤالت را بنویس و ارسال کن. گفتگو همین‌جا نمایش داده می‌شود.</p></section><section id="messages" aria-live="polite"></section><div class="status" id="status" role="status"></div><div class="composer"><form id="chatform"><textarea id="prompt" rows="1" placeholder="پیامت را بنویس…" aria-label="متن پیام" required></textarea><button id="send" type="submit" aria-label="ارسال پیام">➤</button></form><div class="foot">این رابط چت داخل سایت شماست؛ سرویس رسمی Duck.ai نیست.</div></div></main>
<script>
const API_URL="https://aitel-ai-chat-2026.oj155304.workers.dev/api/chat",form=document.getElementById("chatform"),input=document.getElementById("prompt"),send=document.getElementById("send"),messages=document.getElementById("messages"),statusEl=document.getElementById("status"),welcome=document.getElementById("welcome");let history=[];
function addMessage(role,text){const el=document.createElement("div");el.className="msg "+role;const who=document.createElement("span");who.className="who";who.textContent=role==="user"?"شما":"هوش مصنوعی";const body=document.createElement("div");body.textContent=text;el.append(who,body);messages.appendChild(el);el.scrollIntoView({behavior:"smooth",block:"end"});return el}
function responseText(d){if(typeof d==="string")return d;return d?.answer??d?.response??d?.text??d?.message??d?.result?.response??d?.result?.text??d?.choices?.[0]?.message?.content??""}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;welcome.style.display="none";addMessage("user",message);input.value="";input.style.height="auto";send.disabled=true;statusEl.textContent="در حال دریافت پاسخ…";const loading=addMessage("assistant","در حال فکر کردن…");
try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history,webSearch:true})});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{data={text:raw}}if(!res.ok)throw new Error(data.error||data.message||("خطای سرویس ("+res.status+")"));const answer=responseText(data);if(!answer)throw new Error(data.error||"سرویس پاسخ قابل‌نمایشی برنگرداند.");loading.lastChild.textContent=answer;history.push({role:"user",content:message},{role:"assistant",content:answer});statusEl.textContent=""}
catch(err){loading.lastChild.textContent="پاسخ دریافت نشد: "+(err.message||"خطای اتصال")+". ممکن است تنظیمات یا اعتبار سرویس Worker نیاز به بررسی داشته باشد.";statusEl.textContent="اتصال به سرویس با خطا روبه‌رو شد."}finally{send.disabled=false;input.focus()}});
document.getElementById("newchat").addEventListener("click",()=>{messages.replaceChildren();history=[];welcome.style.display="block";statusEl.textContent="گفتگوی جدید آماده است.";input.value="";input.focus()});
</script></body></html>
